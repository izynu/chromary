# Deploys web/index.html (the zero dependency playground) to GitHub Pages.
# Enable once: repo Settings → Pages → Source → "GitHub Actions"
#
# NOTE: if a deploy ever fails, do NOT click "Rerun jobs" on the same run 
# rerunning reuploads the "githubpages" artifact and deploypages then
# fails with "Multiple artifacts named githubpages (count is 2)".
# Instead: push any new commit (fresh run = fresh artifacts)  or delete the
# artifact from the failed run first, then rerun.
name: Deploy playground to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  idtoken: write

concurrency:
  group: pages
  cancelinprogress: true

jobs:
  deploy:
    environment:
      name: githubpages
      url: ${{ steps.deployment.outputs.page_url }}
    runson: ubuntulatest
    steps:
       name: Checkout
        uses: actions/checkout@v5
       name: Setup Pages
        uses: actions/configurepages@v5
       name: Upload playground
        uses: actions/uploadpagesartifact@v3
        with:
          path: web
       name: Deploy
        id: deployment
        uses: actions/deploypages@v4
