# Deploys web/index.html (the zero dependency playground) to GitHub Pages.
# Enable once: repo Settings → Pages → Source → "GitHub Actions"
#
# NOTE: if a deploy ever fails, do NOT click "Re-run jobs" on the same run —
# re-running re-uploads the "github-pages" artifact and deploy-pages then
# fails with "Multiple artifacts named github-pages (count is 2)".
# Instead: push any new commit (fresh run = fresh artifacts) — or delete the
# artifact from the failed run first, then re-run.
name: Deploy playground to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload playground
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
