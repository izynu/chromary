<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Chromary, a working color library for AI agents. Animated banner.">
  <defs>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="#202521"/>

  <!-- drifting brand blobs: pine, citron, coral, sand -->
  <g filter="url(#blur)">
    <circle cx="170" cy="90" r="130" fill="#225C48" opacity="0.55">
      <animate attributeName="opacity" values="0.42;0.66;0.42" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="170;235;170" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle cx="420" cy="270" r="125" fill="#C85B43" opacity="0.34">
      <animate attributeName="opacity" values="0.24;0.44;0.24" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="270;210;270" dur="21s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="60" r="115" fill="#D9EF72" opacity="0.22">
      <animate attributeName="opacity" values="0.14;0.3;0.14" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="700;655;700" dur="23s" repeatCount="indefinite"/>
    </circle>
    <circle cx="960" cy="250" r="120" fill="#35695A" opacity="0.5">
      <animate attributeName="opacity" values="0.38;0.6;0.38" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="250;195;250" dur="19s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1130" cy="70" r="95" fill="#C85B43" opacity="0.3">
      <animate attributeName="opacity" values="0.2;0.38;0.2" dur="7.5s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="1130;1080;1130" dur="15s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- rising particles -->
  <g fill="#F7F6F2">
    <circle cx="230" cy="330" r="2" opacity="0">
      <animate attributeName="cy" values="330;40" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.55;0" dur="16s" repeatCount="indefinite"/>
    </circle>
    <circle cx="520" cy="340" r="1.5" opacity="0">
      <animate attributeName="cy" values="340;30" dur="22s" begin="-6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.45;0" dur="22s" begin="-6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="810" cy="330" r="2.5" opacity="0">
      <animate attributeName="cy" values="330;50" dur="18s" begin="-11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="18s" begin="-11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="340" r="1.5" opacity="0">
      <animate attributeName="cy" values="340;40" dur="20s" begin="-3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.4;0" dur="20s" begin="-3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="70" cy="340" r="1.5" opacity="0">
      <animate attributeName="cy" values="340;60" dur="24s" begin="-15s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.35;0" dur="24s" begin="-15s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- wordmark -->
  <text x="600" y="150" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="600" letter-spacing="16" fill="#F7F6F2">CHROMARY</text>
  <rect x="470" y="172" width="260" height="3" fill="#D9EF72"/>
  <text x="600" y="212" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#D8DBD0">A working color library for AI agents</text>
  <text x="600" y="244" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#8B9186" letter-spacing="2">200+ RESOURCES · 6 AGENT SKILLS · 9 RECIPES · MCP READY</text>

  <!-- brand palette strip -->
  <g>
    <rect x="318" y="272" width="104" height="14" rx="4" fill="#225C48">
      <animate attributeName="fill" values="#225C48;#35695A;#225C48" dur="9s" repeatCount="indefinite"/>
    </rect>
    <rect x="434" y="272" width="104" height="14" rx="4" fill="#D9EF72">
      <animate attributeName="fill" values="#D9EF72;#C9DA66;#D9EF72" dur="9s" repeatCount="indefinite"/>
    </rect>
    <rect x="550" y="272" width="104" height="14" rx="4" fill="#C85B43">
      <animate attributeName="fill" values="#C85B43;#B04E38;#C85B43" dur="9s" repeatCount="indefinite"/>
    </rect>
    <rect x="666" y="272" width="104" height="14" rx="4" fill="#F7F6F2">
      <animate attributeName="fill" values="#F7F6F2;#E4E2D8;#F7F6F2" dur="9s" repeatCount="indefinite"/>
    </rect>
    <rect x="782" y="272" width="104" height="14" rx="4" fill="#35695A">
      <animate attributeName="fill" values="#35695A;#225C48;#35695A" dur="9s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
